[project]
name = "minecraft-object-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
  "mmengine>=0.10.7",
  "openmim>=0.3.9",
  "setuptools<81",
  "numpy<2",
  "ipykernel>=7.2.0",
  "pydantic>=2.13.4",
  "seaborn>=0.13.2",
  "ultralytics>=8.4.62",
  "reportlab>=4.5.1",
]

[project.optional-dependencies]
cpu = ["torch==2.1.2", "torchvision==0.16.2"]
gpu = ["torch==2.1.2", "torchvision==0.16.2"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
  { index = "torch-cpu", extra = "cpu" },
  { index = "torch-gpu", extra = "gpu" },
]
torchvision = [
  { index = "torch-cpu", extra = "cpu" },
  { index = "torch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
