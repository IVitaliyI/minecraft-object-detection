[project]
name = "minecraft-object-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = ["mmengine>=0.10.7", "mmdet==3.3.0"]

[project.optional-dependencies]
cpu = ["torch==2.1.2", "torchvision==0.16.2", "mmcv==2.1.0"]
gpu = ["torch==2.1.2", "torchvision==0.16.2", "mmcv==2.1.0"]

[[tool.uv.index]]
name = "mmcv-cpu"
url = "https://download.openmmlab.com/mmcv/dist/cpu/torch2.1/index.html"

[[tool.uv.index]]
name = "mmcv-gpu"
url = "https://download.openmmlab.com/mmcv/dist/cu121/torch2.1/index.html"

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
torch = [
  { index = "torch-cpu", extra = "cpu" },
  { index = "torch-gpu", extra = "gpu" },
]
mmcv = [
  { index = "mmcv-cpu", extra = "cpu" },
  { index = "mmcv-gpu", extra = "gpu" },
]
torchvision = [
  { index = "torch-cpu", extra = "cpu" },
  { index = "torch-gpu", extra = "gpu" },
]
mmdet = { path = "./mmdetection", editable = true }

[tool.uv.extra-build-dependencies]
mmdet = ["torch"]
